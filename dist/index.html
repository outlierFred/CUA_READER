<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn a pasted response into a clean list of input-file links.">
  <meta name="theme-color" content="#12352f">
  <title>Link Lens</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312352f'/%3E%3Cpath d='M12.2 19.8l-1.4 1.4a4.2 4.2 0 01-6-6l4-4a4.2 4.2 0 016 0' fill='none' stroke='%23f6c453' stroke-width='2.7' stroke-linecap='round'/%3E%3Cpath d='M19.8 12.2l1.4-1.4a4.2 4.2 0 016 6l-4 4a4.2 4.2 0 01-6 0' fill='none' stroke='%23fff' stroke-width='2.7' stroke-linecap='round'/%3E%3Cpath d='M11.5 20.5l9-9' stroke='%23fff' stroke-width='2.7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #14312d;
      --muted: #667a75;
      --forest: #12352f;
      --forest-hover: #0d2925;
      --gold: #f6c453;
      --paper: #f5f7f4;
      --white: #ffffff;
      --line: #d8e0dc;
      --soft: #edf2ef;
      --danger: #9e3d34;
      --danger-soft: #fff1ef;
      --shadow: 0 18px 55px rgba(18, 53, 47, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 7% 0%, rgba(246, 196, 83, .16), transparent 24rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    button, textarea { font: inherit; }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 14px;
      background: var(--forest);
      box-shadow: 0 8px 24px rgba(18, 53, 47, .18);
    }

    .mark svg { width: 26px; height: 26px; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      line-height: 1;
      letter-spacing: -.035em;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .input-panel { padding: clamp(20px, 4vw, 34px); }

    .field-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    label, h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 760;
      letter-spacing: -.01em;
    }

    .privacy-note {
      color: var(--muted);
      font-size: .82rem;
      white-space: nowrap;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 260px;
      resize: vertical;
      padding: 18px;
      border: 1px solid #bfcac5;
      border-radius: 13px;
      outline: none;
      background: #fbfcfb;
      color: #1d322e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .92rem;
      line-height: 1.55;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    textarea::placeholder { color: #879792; }

    textarea:focus {
      border-color: var(--forest);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(18, 53, 47, .10);
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
    }

    .action-group { display: flex; gap: 10px; }

    button {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 720;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid rgba(246, 196, 83, .8); outline-offset: 2px; }

    .primary {
      background: var(--forest);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(18, 53, 47, .18);
    }

    .primary:hover { background: var(--forest-hover); }

    .quiet { background: var(--soft); color: var(--ink); }
    .quiet:hover { background: #e3ebe7; }

    .helper {
      margin: 0;
      color: var(--muted);
      font-size: .86rem;
      text-align: right;
    }

    .message {
      display: none;
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .92rem;
    }

    .message.show { display: block; }
    .message.error { background: var(--danger-soft); color: var(--danger); }
    .message.info { background: #eef5f3; color: var(--forest); }

    .results {
      display: none;
      padding: clamp(20px, 4vw, 34px);
      border-top: 1px solid var(--line);
      background: #fbfcfb;
    }

    .results.show { display: block; }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .count {
      min-width: 30px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gold);
      color: #352a10;
      font-size: .82rem;
      font-weight: 800;
      text-align: center;
    }

    .link-list { display: grid; gap: 10px; }

    .link-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 20px;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
    }

    .file-name {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-weight: 710;
      text-decoration-color: #87a099;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .file-name:hover { text-decoration-color: var(--forest); }

    .file-name:focus-visible {
      border-radius: 3px;
      outline: 3px solid rgba(246, 196, 83, .75);
      outline-offset: 3px;
    }

    .domain {
      display: block;
      overflow: hidden;
      margin-top: 3px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .open-label {
      color: var(--forest);
      font-size: .84rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .invalid-link .file-name { text-decoration: none; }
    .invalid-link .open-label { color: var(--muted); }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 980px); padding: 22px 0 38px; }
      header { align-items: flex-start; margin-left: 4px; }
      header p { line-height: 1.4; }
      .workspace { border-radius: 17px; }
      .field-heading { align-items: flex-start; flex-direction: column; gap: 2px; }
      .privacy-note { white-space: normal; }
      textarea { min-height: 230px; }
      .actions { align-items: stretch; flex-direction: column; }
      .action-group { display: grid; grid-template-columns: 1fr auto; }
      .helper { text-align: left; }
      .link-card { gap: 10px; padding: 14px; }
      .open-label { font-size: 0; }
      .open-label::after { content: "↗"; font-size: 1.1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M12.2 19.8l-1.4 1.4a4.2 4.2 0 01-6-6l4-4a4.2 4.2 0 016 0" stroke="#f6c453" stroke-width="2.7" stroke-linecap="round"/>
          <path d="M19.8 12.2l1.4-1.4a4.2 4.2 0 016 6l-4 4a4.2 4.2 0 01-6 0" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
          <path d="M11.5 20.5l9-9" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>Link Lens</h1>
        <p>Turn a full response into a tidy list of input files.</p>
      </div>
    </header>

    <section class="workspace" aria-labelledby="paste-label">
      <div class="input-panel">
        <div class="field-heading">
          <label id="paste-label" for="source">Paste your response</label>
          <span class="privacy-note">Your content stays in this browser</span>
        </div>
        <textarea id="source" spellcheck="false" autocomplete="off" placeholder="Paste the full response here…" aria-describedby="paste-help message"></textarea>
        <div class="actions">
          <div class="action-group">
            <button class="primary" id="find" type="button">Find input links</button>
            <button class="quiet" id="clear" type="button">Clear</button>
          </div>
          <p class="helper" id="paste-help">Large responses are welcome.</p>
        </div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </div>

      <section class="results" id="results" aria-labelledby="results-title">
        <div class="results-heading">
          <h2 id="results-title">Input links</h2>
          <span class="count" id="count" aria-label="0 links found">0</span>
        </div>
        <div class="link-list" id="link-list"></div>
      </section>
    </section>

    <footer>Open a filename to visit its link.</footer>
  </main>

  <script>
    (() => {
      const source = document.querySelector('#source');
      const findButton = document.querySelector('#find');
      const clearButton = document.querySelector('#clear');
      const message = document.querySelector('#message');
      const results = document.querySelector('#results');
      const count = document.querySelector('#count');
      const list = document.querySelector('#link-list');

      function showMessage(text, type = 'error') {
        message.textContent = text;
        message.className = `message show ${type}`;
      }

      function hideMessage() {
        message.textContent = '';
        message.className = 'message';
      }

      function asSafeWebLink(value) {
        try {
          const parsed = new URL(String(value));
          return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : null;
        } catch {
          return null;
        }
      }

      function getInputFiles(data) {
        const found = [];
        const seenObjects = new WeakSet();

        function addFiles(value) {
          if (!Array.isArray(value)) return;
          value.forEach((item) => {
            if (!item || typeof item !== 'object') return;
            if (typeof item.name !== 'string' || typeof item.url !== 'string') return;
            found.push({ name: item.name.trim() || 'Unnamed file', url: item.url.trim() });
          });
        }

        const before = data?.response?.before;
        if (before && typeof before === 'object') {
          Object.values(before).forEach((step) => addFiles(step?.output?.init_file_upload));
        }

        function visit(value) {
          if (!value || typeof value !== 'object' || seenObjects.has(value)) return;
          seenObjects.add(value);
          if (Object.prototype.hasOwnProperty.call(value, 'init_file_upload')) {
            addFiles(value.init_file_upload);
          }
          if (Array.isArray(value)) value.forEach(visit);
          else Object.values(value).forEach(visit);
        }

        if (!found.length) visit(data);

        const unique = new Map();
        found.forEach((file) => unique.set(`${file.name}\u0000${file.url}`, file));
        return [...unique.values()];
      }

      function renderLinks(files) {
        list.replaceChildren();
        const fragment = document.createDocumentFragment();

        files.forEach((file) => {
          const safeUrl = asSafeWebLink(file.url);
          const card = document.createElement('article');
          card.className = safeUrl ? 'link-card' : 'link-card invalid-link';

          const details = document.createElement('div');
          const name = safeUrl ? document.createElement('a') : document.createElement('span');
          name.className = 'file-name';
          name.textContent = file.name;

          if (safeUrl) {
            name.href = safeUrl;
            name.target = '_blank';
            name.rel = 'noopener noreferrer';
          }

          const domain = document.createElement('span');
          domain.className = 'domain';
          domain.textContent = safeUrl ? new URL(safeUrl).hostname : 'Link unavailable';
          details.append(name, domain);

          const action = document.createElement('span');
          action.className = 'open-label';
          action.setAttribute('aria-hidden', 'true');
          action.textContent = safeUrl ? 'Open link ↗' : 'Unavailable';

          card.append(details, action);
          fragment.append(card);
        });

        list.append(fragment);
        count.textContent = String(files.length);
        count.setAttribute('aria-label', `${files.length} ${files.length === 1 ? 'link' : 'links'} found`);
        results.classList.add('show');
      }

      function findLinks() {
        hideMessage();
        results.classList.remove('show');

        const text = source.value.trim();
        if (!text) {
          showMessage('Paste a response first, then try again.');
          source.focus();
          return [];
        }

        let data;
        try {
          data = JSON.parse(text.replace(/^\uFEFF/, ''));
        } catch {
          showMessage('That response could not be read. Check that you copied all of it and try again.');
          return [];
        }

        const files = getInputFiles(data);
        if (!files.length) {
          showMessage('No input links were found in this response.', 'info');
          return [];
        }

        renderLinks(files);
        results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return files;
      }

      function clearAll() {
        source.value = '';
        hideMessage();
        list.replaceChildren();
        results.classList.remove('show');
        count.textContent = '0';
        source.focus();
      }

      findButton.addEventListener('click', findLinks);
      clearButton.addEventListener('click', clearAll);
      source.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') findLinks();
      });

      window.linkLens = { findLinks, clearAll };

      const context = document.modelContext;
      if (context?.registerTool) {
        try {
          void Promise.resolve(context.registerTool({
            name: 'show_input_links',
            title: 'Show input links',
            description: 'Paste a full response into Link Lens and show the filenames and web links found in its input-file list.',
            inputSchema: {
              type: 'object',
              properties: {
                responseText: {
                  type: 'string',
                  description: 'The complete response text to read.'
                }
              },
              required: ['responseText'],
              additionalProperties: false
            },
            annotations: { readOnlyHint: false, untrustedContentHint: true },
            execute(input) {
              if (!input || typeof input.responseText !== 'string' || !input.responseText.trim()) {
                throw new Error('A complete response is required.');
              }
              source.value = input.responseText;
              const files = findLinks();
              return {
                linksFound: files.length,
                files: files.map(({ name, url }) => ({ name, url }))
              };
            }
          })).catch(() => {});
        } catch {
          // The visible page continues to work when browser tools are unavailable.
        }
      }
    })();
  </script>
</body>
</html>
