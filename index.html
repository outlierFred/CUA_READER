<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Turn a pasted response into a clean list of input-file links.">
  <meta name="theme-color" content="#12352f">
  <title>CUA Reader</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312352f'/%3E%3Cpath d='M12.2 19.8l-1.4 1.4a4.2 4.2 0 01-6-6l4-4a4.2 4.2 0 016 0' fill='none' stroke='%23f6c453' stroke-width='2.7' stroke-linecap='round'/%3E%3Cpath d='M19.8 12.2l1.4-1.4a4.2 4.2 0 016 6l-4 4a4.2 4.2 0 01-6 0' fill='none' stroke='%23fff' stroke-width='2.7' stroke-linecap='round'/%3E%3Cpath d='M11.5 20.5l9-9' stroke='%23fff' stroke-width='2.7' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #14312d;
      --muted: #667a75;
      --forest: #12352f;
      --forest-hover: #0d2925;
      --gold: #f6c453;
      --paper: #f5f7f4;
      --white: #ffffff;
      --line: #d8e0dc;
      --soft: #edf2ef;
      --danger: #9e3d34;
      --danger-soft: #fff1ef;
      --success: #176b52;
      --shadow: 0 18px 55px rgba(18, 53, 47, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 7% 0%, rgba(246, 196, 83, .16), transparent 24rem),
        var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
    }

    button, textarea { font: inherit; }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 64px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 14px;
      background: var(--forest);
      box-shadow: 0 8px 24px rgba(18, 53, 47, .18);
    }

    .mark svg { width: 26px; height: 26px; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.85rem, 4vw, 2.5rem);
      line-height: 1;
      letter-spacing: -.035em;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .input-panel { padding: clamp(20px, 4vw, 34px); }

    .field-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .validity {
      min-height: 1.75rem;
      color: var(--success);
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.2;
      text-align: right;
    }

    label, h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 760;
      letter-spacing: -.01em;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 260px;
      resize: vertical;
      padding: 18px;
      border: 1px solid #bfcac5;
      border-radius: 13px;
      outline: none;
      background: #fbfcfb;
      color: #1d322e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: .92rem;
      line-height: 1.55;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    textarea::placeholder { color: #879792; }

    textarea:focus {
      border-color: var(--forest);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(18, 53, 47, .10);
    }

    textarea.is-valid {
      border-color: var(--success);
      background: #fbfffd;
    }

    textarea.is-invalid {
      border-color: var(--danger);
      background: #fffdfc;
    }

    textarea.is-valid:focus { box-shadow: 0 0 0 4px rgba(23, 107, 82, .11); }
    textarea.is-invalid:focus { box-shadow: 0 0 0 4px rgba(158, 61, 52, .10); }

    .validation {
      display: none;
      align-items: flex-start;
      gap: 8px;
      min-height: 22px;
      margin: 9px 2px -4px;
      color: var(--muted);
      font-size: .84rem;
      line-height: 1.45;
    }

    .validation::before {
      content: "";
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      margin-top: .37rem;
      border-radius: 50%;
      background: #a6b2ae;
    }

    .validation.invalid { display: flex; color: var(--danger); }
    .validation.invalid::before { background: var(--danger); }

    .actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 16px;
    }

    .action-group { display: flex; gap: 10px; }

    button {
      min-height: 46px;
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 720;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid rgba(246, 196, 83, .8); outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .5; transform: none; }

    .primary {
      background: var(--forest);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(18, 53, 47, .18);
    }

    .primary:hover { background: var(--forest-hover); }

    .quiet { background: var(--soft); color: var(--ink); }
    .quiet:hover { background: #e3ebe7; }

    .message {
      display: none;
      margin: 16px 0 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: .92rem;
    }

    .message.show { display: block; }
    .message.error { background: var(--danger-soft); color: var(--danger); }
    .message.info { background: #eef5f3; color: var(--forest); }

    .results {
      display: none;
      padding: clamp(20px, 4vw, 34px);
      border-top: 1px solid var(--line);
      background: #fbfcfb;
    }

    .results.show { display: block; }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .count {
      min-width: 30px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--gold);
      color: #352a10;
      font-size: .82rem;
      font-weight: 800;
      text-align: center;
    }

    .link-list { display: grid; gap: 10px; }

    .link-card {
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
    }

    .file-name {
      overflow-wrap: anywhere;
      color: var(--ink);
      font-weight: 710;
      text-decoration-color: #87a099;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .file-name:hover { text-decoration-color: var(--forest); }

    .file-name:focus-visible {
      border-radius: 3px;
      outline: 3px solid rgba(246, 196, 83, .75);
      outline-offset: 3px;
    }

    .file-url {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 500;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .invalid-link .file-name { text-decoration: none; }

    @media (max-width: 640px) {
      .shell { width: min(100% - 20px, 980px); padding: 22px 0 38px; }
      header { align-items: flex-start; margin-left: 4px; }
      .workspace { border-radius: 17px; }
      .validity { font-size: 1.1rem; }
      textarea { min-height: 230px; }
      .actions { align-items: stretch; flex-direction: column; }
      .action-group { display: grid; grid-template-columns: 1fr auto auto; }
      .link-card { padding: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M12.2 19.8l-1.4 1.4a4.2 4.2 0 01-6-6l4-4a4.2 4.2 0 016 0" stroke="#f6c453" stroke-width="2.7" stroke-linecap="round"/>
          <path d="M19.8 12.2l1.4-1.4a4.2 4.2 0 016 6l-4 4a4.2 4.2 0 01-6 0" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
          <path d="M11.5 20.5l9-9" stroke="#fff" stroke-width="2.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <h1>CUA Reader</h1>
      </div>
    </header>

    <section class="workspace" aria-labelledby="paste-label">
      <div class="input-panel">
        <div class="field-heading">
          <label id="paste-label" for="source">Paste JSON response</label>
          <div class="validity" id="validity" role="status" aria-live="polite"></div>
        </div>
        <textarea id="source" spellcheck="false" autocomplete="off" placeholder="Paste the full JSON response here…" aria-describedby="validation message"></textarea>
        <div class="validation" id="validation" role="status" aria-live="polite"></div>
        <div class="actions">
          <div class="action-group">
            <button class="primary" id="find" type="button">Find asset uploads</button>
            <button class="quiet" id="format" type="button" disabled>Format JSON</button>
            <button class="quiet" id="clear" type="button">Clear</button>
          </div>
        </div>
        <div class="message" id="message" role="status" aria-live="polite"></div>
      </div>

      <section class="results" id="results" aria-labelledby="results-title">
        <div class="results-heading">
          <h2 id="results-title">Asset upload</h2>
          <span class="count" id="count" aria-label="0 links found">0</span>
        </div>
        <div class="link-list" id="link-list"></div>
      </section>
    </section>

  </main>

  <script>
    (() => {
      const source = document.querySelector('#source');
      const findButton = document.querySelector('#find');
      const formatButton = document.querySelector('#format');
      const clearButton = document.querySelector('#clear');
      const validity = document.querySelector('#validity');
      const validation = document.querySelector('#validation');
      const message = document.querySelector('#message');
      const results = document.querySelector('#results');
      const count = document.querySelector('#count');
      const list = document.querySelector('#link-list');

      function showMessage(text, type = 'error') {
        message.textContent = text;
        message.className = `message show ${type}`;
      }

      function hideMessage() {
        message.textContent = '';
        message.className = 'message';
      }

      function locationFromPosition(text, position) {
        const before = text.slice(0, Math.max(0, position));
        const lines = before.split(/\r\n|\r|\n/);
        return { line: lines.length, column: lines[lines.length - 1].length + 1 };
      }

      function describeJsonError(error, text) {
        const raw = error instanceof Error ? error.message : String(error);
        const positionMatch = raw.match(/(?:at position|position)\s+(\d+)/i);
        const lineColumnMatch = raw.match(/line\s+(\d+)\s+column\s+(\d+)/i);
        let location = '';

        if (positionMatch) {
          const { line, column } = locationFromPosition(text, Number(positionMatch[1]));
          location = ` at line ${line}, column ${column}`;
        } else if (lineColumnMatch) {
          location = ` at line ${lineColumnMatch[1]}, column ${lineColumnMatch[2]}`;
        }

        const detail = raw
          .replace(/^JSON\.parse:\s*/i, '')
          .replace(/\s+at position\s+\d+.*$/i, '')
          .replace(/\s+at line\s+\d+\s+column\s+\d+.*$/i, '')
          .replace(/^Unexpected token '?(.+?)'?[,]? /i, 'Unexpected token $1: ');
        return `Invalid JSON${location}: ${detail}`;
      }

      function validateJson({ focusError = false } = {}) {
        const text = source.value.replace(/^\uFEFF/, '');
        source.classList.remove('is-valid', 'is-invalid');
        source.removeAttribute('aria-invalid');

        if (!text.trim()) {
          validity.textContent = '';
          validation.textContent = '';
          validation.className = 'validation';
          formatButton.disabled = true;
          return { valid: false, empty: true, data: null };
        }

        try {
          const data = JSON.parse(text);
          validity.textContent = 'Valid JSON';
          validation.textContent = '';
          validation.className = 'validation';
          source.classList.add('is-valid');
          source.setAttribute('aria-invalid', 'false');
          formatButton.disabled = false;
          return { valid: true, empty: false, data };
        } catch (error) {
          validity.textContent = '';
          validation.textContent = describeJsonError(error, text);
          validation.className = 'validation invalid';
          source.classList.add('is-invalid');
          source.setAttribute('aria-invalid', 'true');
          formatButton.disabled = true;
          if (focusError) source.focus();
          return { valid: false, empty: false, data: null };
        }
      }

      function asSafeWebLink(value) {
        try {
          const parsed = new URL(String(value));
          return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : null;
        } catch {
          return null;
        }
      }

      function getInputFiles(data) {
        const uploads = data?.task?.response?.before?.['step-TextCollection-76e7ad3fc87b']?.output?.asset_upload;
        if (!Array.isArray(uploads)) return [];

        const found = uploads
          .filter((item) => item && typeof item === 'object')
          .filter((item) => typeof item.name === 'string' && typeof item.s3Url === 'string')
          .map((item) => ({
            name: item.name.trim() || 'Unnamed file',
            s3Url: item.s3Url.trim()
          }));

        const unique = new Map();
        found.forEach((file) => unique.set(`${file.name}\u0000${file.s3Url}`, file));
        return [...unique.values()];
      }

      function renderLinks(files) {
        list.replaceChildren();
        const fragment = document.createDocumentFragment();

        files.forEach((file) => {
          const safeUrl = asSafeWebLink(file.s3Url);
          const card = document.createElement('article');
          card.className = safeUrl ? 'link-card' : 'link-card invalid-link';

          const details = document.createElement('div');
          const name = safeUrl ? document.createElement('a') : document.createElement('span');
          name.className = 'file-name';
          name.textContent = file.name;

          if (safeUrl) {
            name.href = safeUrl;
            name.target = '_blank';
            name.rel = 'noopener noreferrer';
          }

          const fullUrl = document.createElement('span');
          fullUrl.className = 'file-url';
          fullUrl.textContent = file.s3Url || 'Link unavailable';
          details.append(name, fullUrl);

          card.append(details);
          fragment.append(card);
        });

        list.append(fragment);
        count.textContent = String(files.length);
        count.setAttribute('aria-label', `${files.length} ${files.length === 1 ? 'link' : 'links'} found`);
        results.classList.add('show');
      }

      function findLinks() {
        hideMessage();
        results.classList.remove('show');

        const check = validateJson({ focusError: true });
        if (check.empty) {
          showMessage('Paste a response first, then try again.');
          source.focus();
          return [];
        }
        if (!check.valid) {
          showMessage('Fix the JSON error shown above, then try again.');
          return [];
        }

        const files = getInputFiles(check.data);
        if (!files.length) {
          showMessage('No asset uploads were found in this response.', 'info');
          return [];
        }

        renderLinks(files);
        results.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return files;
      }

      function clearAll() {
        source.value = '';
        hideMessage();
        list.replaceChildren();
        results.classList.remove('show');
        count.textContent = '0';
        validateJson();
        source.focus();
      }

      function formatJson() {
        const check = validateJson({ focusError: true });
        if (!check.valid) return;
        source.value = JSON.stringify(check.data, null, 2);
        validateJson();
        source.focus();
      }

      let validationTimer;
      function queueValidation() {
        clearTimeout(validationTimer);
        validationTimer = setTimeout(validateJson, 180);
      }

      findButton.addEventListener('click', findLinks);
      formatButton.addEventListener('click', formatJson);
      clearButton.addEventListener('click', clearAll);
      source.addEventListener('input', queueValidation);
      source.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') findLinks();
      });

      window.cuaReader = { findLinks, clearAll };

      const context = document.modelContext;
      if (context?.registerTool) {
        try {
          void Promise.resolve(context.registerTool({
            name: 'show_input_links',
            title: 'Show input links',
            description: 'Paste a full response into CUA Reader and show the filenames and web links found in its asset list.',
            inputSchema: {
              type: 'object',
              properties: {
                responseText: {
                  type: 'string',
                  description: 'The complete response text to read.'
                }
              },
              required: ['responseText'],
              additionalProperties: false
            },
            annotations: { readOnlyHint: false, untrustedContentHint: true },
            execute(input) {
              if (!input || typeof input.responseText !== 'string' || !input.responseText.trim()) {
                throw new Error('A complete response is required.');
              }
              source.value = input.responseText;
              const files = findLinks();
              return {
                linksFound: files.length,
                files: files.map(({ name, s3Url }) => ({ name, s3Url }))
              };
            }
          })).catch(() => {});
        } catch {
          // The visible page continues to work when browser tools are unavailable.
        }
      }
    })();
  </script>
</body>
</html>
